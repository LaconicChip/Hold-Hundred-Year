<!-- 贴纸风 SVG 图标 sprite：墨色描边，currentColor 继承主题色。全站无 emoji
     说明：flame / bull / bear 为吉祥物类图标，保留自身配色；
     其余线性图标统一 currentColor，随所处文本色变化。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute;" aria-hidden="true">
  <symbol id="chart" viewBox="0 0 24 24">
    <path d="M4 19 L9 13 L13 16 L20 7"/>
    <path d="M15 7 H20 V12"/>
  </symbol>
  <symbol id="play" viewBox="0 0 24 24">
    <path d="M7 4.5 L19.5 12 L7 19.5 Z" fill="currentColor" stroke="currentColor"/>
  </symbol>
  <symbol id="skip" viewBox="0 0 24 24">
    <path d="M5 5 L13 12 L5 19 Z" fill="currentColor" stroke="currentColor"/>
    <path d="M12.5 5 L20.5 12 L12.5 19 Z" fill="currentColor" stroke="currentColor"/>
  </symbol>
  <symbol id="alert" viewBox="0 0 24 24">
    <path d="M12 3.5 L22 20 H2 Z"/>
    <path d="M12 10 V14.5" /><circle cx="12" cy="17.6" r="0.4" fill="currentColor"/>
  </symbol>
  <symbol id="bell" viewBox="0 0 24 24">
    <path d="M6 16 V11 a6 6 0 0 1 12 0 V16 L19.5 19 H4.5 Z"/>
    <path d="M10 19 a2 2 0 0 0 4 0"/>
  </symbol>
  <symbol id="door" viewBox="0 0 24 24">
    <path d="M6 21 V4.5 a1.5 1.5 0 0 1 1.5-1.5 h9 A1.5 1.5 0 0 1 18 4.5 V21"/>
    <path d="M4 21 H20"/>
    <circle cx="15.5" cy="12.5" r="1.1" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="flame" viewBox="0 0 24 24">
    <path d="M12 1.8 C13 6.2 17.4 8 17.4 12.9 C17.4 17.9 15 21.4 12 21.4 C9 21.4 6.6 17.9 6.6 13.7 C6.6 10.5 8.3 8.7 9.8 7.1 C9.4 9.8 10.9 11.2 12.1 11.5 C11.4 8.6 10.7 5 12 1.8 Z"
      fill="#ff652b" stroke="#2b2620" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M12 10.2 C12.6 12.6 15 13.7 15 16.4 C15 19.1 13.7 20.5 12 20.5 C10.3 20.5 9.1 18.6 9.1 16.4 C9.1 14 10.8 13 11.3 11.2 C11.7 13 12.8 13.3 13 12.1 C12.8 11.2 12.1 10.8 12 10.2 Z"
      fill="#ffc53d" stroke="none"/>
    <path d="M12 15.4 C12.3 16.4 13.3 16.9 13.3 18 C13.3 19.2 12.7 19.8 12 19.8 C11.3 19.8 10.7 19 10.7 18.1 C10.7 17 11.6 16.5 12 15.4 Z"
      fill="#fff3c4" stroke="none"/>
  </symbol>
  <symbol id="bull" viewBox="0 0 24 24">
    <!-- 一对大弯角（牛的辨识特征） -->
    <path d="M9.8 9.6 C7 9 4.4 7.4 4.8 3.2 C6.4 3 8.1 4.1 8.7 6.1 C9.1 7.5 9.8 8.6 10.7 9.3 Z"
      fill="#fffdf7" stroke="#2b2620" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M14.2 9.6 C17 9 19.6 7.4 19.2 3.2 C17.6 3 15.9 4.1 15.3 6.1 C14.9 7.5 14.2 8.6 13.3 9.3 Z"
      fill="#fffdf7" stroke="#2b2620" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- 侧边小耳 -->
    <ellipse cx="5.2" cy="11.8" rx="1.6" ry="1.1" fill="#c99a6b" stroke="#2b2620" stroke-width="1.6" transform="rotate(-30 5.2 11.8)"/>
    <ellipse cx="18.8" cy="11.8" rx="1.6" ry="1.1" fill="#c99a6b" stroke="#2b2620" stroke-width="1.6" transform="rotate(30 18.8 11.8)"/>
    <!-- 圆脸（与熊同款暖棕毛色，不靠颜色区分） -->
    <ellipse cx="12" cy="14" rx="6.6" ry="6.1" fill="#c99a6b" stroke="#2b2620" stroke-width="1.8"/>
    <!-- 头顶小呆毛 -->
    <path d="M11 8.1 Q12 6.8 13 8.1 Q12.3 7.7 12 8.2 Q11.7 7.7 11 8.1 Z" fill="#8a5a3b" stroke="none"/>
    <!-- 腮红 -->
    <circle cx="7.5" cy="14.6" r="1.1" fill="#f2b5a7" stroke="none"/>
    <circle cx="16.5" cy="14.6" r="1.1" fill="#f2b5a7" stroke="none"/>
    <!-- 眼睛 -->
    <circle cx="9.7" cy="12.7" r="1.2" fill="#2b2620" stroke="none"/><circle cx="10.1" cy="12.2" r="0.42" fill="#fffdf7" stroke="none"/>
    <circle cx="14.3" cy="12.7" r="1.2" fill="#2b2620" stroke="none"/><circle cx="14.7" cy="12.2" r="0.42" fill="#fffdf7" stroke="none"/>
    <!-- 宽鼻吻（牛的第二特征：大鼻孔） -->
    <ellipse cx="12" cy="16.5" rx="3.5" ry="2.5" fill="#fffdf7" stroke="#2b2620" stroke-width="1.6"/>
    <circle cx="10.7" cy="16" r="0.5" fill="#2b2620" stroke="none"/>
    <circle cx="13.3" cy="16" r="0.5" fill="#2b2620" stroke="none"/>
    <path d="M10.6 17.7 Q12 18.6 13.4 17.7" fill="none" stroke="#2b2620" stroke-width="1.4" stroke-linecap="round"/>
  </symbol>
  <symbol id="bear" viewBox="0 0 24 24">
    <!-- 熊猫：两只黑色圆耳 -->
    <circle cx="6.8" cy="6.5" r="2.6" fill="#2b2620"/>
    <circle cx="17.2" cy="6.5" r="2.6" fill="#2b2620"/>
    <!-- 白色圆脸 -->
    <circle cx="12" cy="13.9" r="6.7" fill="#fffdf7" stroke="#2b2620" stroke-width="1.8"/>
    <!-- 圆润黑眼圈（圆角短椭圆，熊猫第一辨识特征） -->
    <ellipse cx="9.6" cy="12.9" rx="1.7" ry="2.05" fill="#2b2620" transform="rotate(-14 9.6 12.9)"/>
    <ellipse cx="14.4" cy="12.9" rx="1.7" ry="2.05" fill="#2b2620" transform="rotate(14 14.4 12.9)"/>
    <!-- 亮晶晶大眼睛（白珠+黑瞳+高光，瞳略朝内看，害羞感） -->
    <circle cx="9.7" cy="12.8" r="0.95" fill="#fffdf7" stroke="none"/>
    <circle cx="9.85" cy="13" r="0.52" fill="#2b2620" stroke="none"/>
    <circle cx="10.05" cy="12.65" r="0.2" fill="#fffdf7" stroke="none"/>
    <circle cx="14.3" cy="12.8" r="0.95" fill="#fffdf7" stroke="none"/>
    <circle cx="14.15" cy="13" r="0.52" fill="#2b2620" stroke="none"/>
    <circle cx="13.95" cy="12.65" r="0.2" fill="#fffdf7" stroke="none"/>
    <!-- 腮红 -->
    <circle cx="7.3" cy="15.2" r="1" fill="#f2b5a7" stroke="none"/>
    <circle cx="16.7" cy="15.2" r="1" fill="#f2b5a7" stroke="none"/>
    <!-- 小圆鼻 + 害羞小笑嘴 -->
    <ellipse cx="12" cy="15.7" rx="0.85" ry="0.6" fill="#2b2620" stroke="none"/>
    <path d="M12 16.3 V16.6 M12 16.6 Q11.3 17.2 10.8 16.7 M12 16.6 Q12.7 17.2 13.2 16.7"
      fill="none" stroke="#2b2620" stroke-width="1.25" stroke-linecap="round"/>
  </symbol>

  <!-- ============ 线性工具图标（currentColor 继承） ============ -->
  <!-- 个股：K 线蜡烛 -->
  <symbol id="candle" viewBox="0 0 24 24">
    <path d="M4 4 V20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M4 20 H20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M9 8 V15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="7" y="8" width="4" height="7" fill="none" stroke="currentColor" stroke-width="1.7"/>
    <path d="M15.5 5 V12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="13.5" y="7" width="4" height="7" fill="currentColor" stroke="currentColor" stroke-width="1.4"/>
  </symbol>
  <!-- 日报：报纸 -->
  <symbol id="newspaper" viewBox="0 0 24 24">
    <rect x="2.6" y="5.5" width="18.8" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M2.6 10 H21.4" stroke="currentColor" stroke-width="1.6"/>
    <rect x="4.6" y="12" width="5.6" height="6.4" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <path d="M12 12.6 H19 M12 15 H19 M12 17.4 H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M6 8 H14.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M17 8 H19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>
  <!-- 结算：证书 + 飘带 -->
  <symbol id="cert" viewBox="0 0 24 24">
    <rect x="4.2" y="2.8" width="15.6" height="12.4" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M7 6.6 H17 M7 9.6 H13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="15.6" cy="11.6" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M12 15.2 V18" stroke="currentColor" stroke-width="1.6"/>
    <path d="M8.4 20.6 L12 22.8 L15.6 20.6 Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
  </symbol>
  <!-- 资产：钱包 -->
  <symbol id="wallet" viewBox="0 0 24 24">
    <path d="M3.4 7 A2.2 2.2 0 0 1 5.6 4.9 H17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="3.4" y="6.4" width="17.2" height="13" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M3.4 10.6 H20.6" stroke="currentColor" stroke-width="1.6"/>
    <circle cx="16.4" cy="15" r="1.35" fill="currentColor" stroke="none"/>
  </symbol>
  <!-- 排行：奖杯 -->
  <symbol id="trophy" viewBox="0 0 24 24">
    <path d="M7 3.6 H17 V9 a5 5 0 0 1-10 0 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M7 5.2 H4.6 V7.8 a2.6 2.6 0 0 0 2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M17 5.2 H19.4 V7.8 a2.6 2.6 0 0 1-2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M12 14 V17.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M8.6 20.6 H15.4 L16.6 17.4 H7.4 Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
  </symbol>
  <!-- 借款：钞票 -->
  <symbol id="banknote" viewBox="0 0 24 24">
    <rect x="2.4" y="6.2" width="19.2" height="11.6" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <path d="M5.6 9.6 V14.4 M18.4 9.6 V14.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>
  <!-- 打新：彩票 -->
  <symbol id="ticket" viewBox="0 0 24 24">
    <path d="M3 7.6 A1.8 1.8 0 0 1 4.8 5.8 H19.2 A1.8 1.8 0 0 1 21 7.6 V9 a2 2 0 0 0 0 6 V16.4 A1.8 1.8 0 0 1 19.2 18.2 H4.8 A1.8 1.8 0 0 1 3 16.4 V15 a2 2 0 0 0 0-6 Z"
      fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M12 8 V16" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 2.4"/>
  </symbol>
  <!-- 维保：天平 -->
  <symbol id="scale" viewBox="0 0 24 24">
    <path d="M12 4 V20 M8 20 H16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M4 8 H20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M4 8 L1.8 13.2 H6.2 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M20 8 L17.8 13.2 H22.2 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="12" cy="5.2" r="1.4" fill="currentColor" stroke="none"/>
  </symbol>
  <!-- 记录：便签 -->
  <symbol id="note" viewBox="0 0 24 24">
    <path d="M5.6 3.2 H15 L18.4 6.6 V20.8 H5.6 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M14.8 3.4 V6.8 H18.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M8.4 10.6 H15.6 M8.4 13.6 H15.6 M8.4 16.6 H12.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>
  <!-- 时间 / 倒计时 -->
  <symbol id="clock" viewBox="0 0 24 24">
    <circle cx="12" cy="12.6" r="8.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M12 7.9 V12.7 L15.6 14.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M9 3.2 H15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>
  <!-- 对勾 / 关闭 / 加减 -->
  <symbol id="check" viewBox="0 0 24 24">
    <path d="M4.6 12.6 L9.6 17.6 L19.4 6.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="close" viewBox="0 0 24 24">
    <path d="M6.4 6.4 L17.6 17.6 M17.6 6.4 L6.4 17.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </symbol>
  <symbol id="plus" viewBox="0 0 24 24">
    <path d="M12 5 V19 M5 12 H19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </symbol>
  <symbol id="minus" viewBox="0 0 24 24">
    <path d="M5 12 H19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </symbol>
  <!-- 涨跌箭头 -->
  <symbol id="arrow-up" viewBox="0 0 24 24">
    <path d="M12 19.4 V5.2 M6 11.2 L12 5.2 L18 11.2" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="arrow-down" viewBox="0 0 24 24">
    <path d="M12 4.6 V18.8 M6 12.8 L12 18.8 L18 12.8" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <!-- 用户 / 密码 -->
  <symbol id="user" viewBox="0 0 24 24">
    <circle cx="12" cy="8.2" r="4.2" fill="none" stroke="currentColor" stroke-width="1.9"/>
    <path d="M4.6 20.4 a7.4 7.4 0 0 1 14.8 0" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
  </symbol>
  <!-- 信息 -->
  <symbol id="info" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.8" fill="none" stroke="currentColor" stroke-width="1.9"/>
    <path d="M12 11 V16.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <circle cx="12" cy="7.9" r="1.1" fill="currentColor" stroke="none"/>
  </symbol>
  <!-- 登出 -->
  <symbol id="logout" viewBox="0 0 24 24">
    <path d="M14.4 4.6 H6.8 A1.8 1.8 0 0 0 5 6.4 V17.6 A1.8 1.8 0 0 0 6.8 19.4 H14.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
    <path d="M18.4 12 H10.2 M15.6 8.8 L18.8 12 L15.6 15.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <!-- 折叠 / 展开 -->
  <symbol id="chevron-left" viewBox="0 0 24 24">
    <path d="M14.6 5.6 L8.2 12 L14.6 18.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="chevron-right" viewBox="0 0 24 24">
    <path d="M9.4 5.6 L15.8 12 L9.4 18.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>
