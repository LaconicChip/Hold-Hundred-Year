# 「解压即玩」档：内嵌 H2 文件库，朋友电脑上不需要装 MySQL。
# 用法：java -jar Hold-Hundred-Year-0.1.1.jar --spring.profiles.active=portable
# 自己本机开发/局域网那套不要带这个 profile（默认走真 MySQL，学习目标就是它的行锁与事务）。

# 存档 = ./data/hold_year.mv.db 这一个文件，备份就是复制它
portable.h2.path=${HOLD_H2_PATH:./data/hold_year}
spring.datasource.url=jdbc:h2:file:${portable.h2.path};MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

server.port=${HOLD_PORT:8080}
# 绿色包的密钥：默认**每次启动随机生成**（random.uuid 占位符）。
# 为什么不能写死：这个包会发给每个玩家，写死的密钥等于公开密钥——读过源码的人能伪造出
# 别人的登录令牌（HS256 + 顺序 userId，见 JwtUtil/JwtAuthFilter）。
# 随机的代价：重启后旧令牌失效，玩家重新进一次游戏即可（存档不受影响）。
# 想固定成自己的一套：设环境变量 HOLD_JWT_SECRET。
app.jwt.secret=${HOLD_JWT_SECRET:${random.uuid}${random.uuid}}
# 与默认档一致给足一年：没有账号系统后，令牌只是"进某份存档"的会话票据。
# 重启后密钥随机化仍会让旧令牌失效，但前端会安静地回到存档架，不会再叠一屏"登录已过期"。
app.jwt.ttl-hours=${HOLD_JWT_TTL_HOURS:8760}

# 游戏窗口：用系统自带的 Edge/Chrome 开一个无地址栏的独立应用窗口（不污染玩家自己的
# 浏览器书签/登录态，关掉这个窗口就等于退出游戏）。装在非标准路径时用 portable.browser-path 指。
portable.browser-path=${HOLD_BROWSER_PATH:}
portable.quit-with-window=${HOLD_QUIT_WITH_WINDOW:true}

# 这是给玩家玩的，不是给运维看的
logging.level.root=INFO
# 日志写进存档目录旁的文件：绿色包是双击启动的，没有控制台可看，
# 朋友那边"打不开/没弹窗口"时，把 data\hold-year.log 发回来就能定位。
logging.file.name=${HOLD_LOG_FILE:./data/hold-year.log}
# 只设 max-file-size / max-history，滚动文件名用 Spring Boot 的默认模板
# （它自带 %d{yyyy-MM-dd} 日期占位符）。自己写 file-name-pattern 而漏掉日期 token 会让
# Logback 抛 "does not contain a valid DateToken"：日志系统初始化失败 -> 进程秒退 ->
# jpackage 启动器只报一句没头没尾的 "Failed to launch JVM"，绿色包直接打不开。
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=5
