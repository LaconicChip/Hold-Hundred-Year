# 「解压即玩」档：内嵌 H2 文件库，朋友电脑上不需要装 MySQL。
# 用法：java -jar Hold-Hundred-Year-0.0.1.jar --spring.profiles.active=portable
# 自己本机开发/局域网那套不要带这个 profile（默认走真 MySQL，学习目标就是它的行锁与事务）。

# 存档 = ./data/hold_year.mv.db 这一个文件，备份就是复制它
portable.h2.path=${HOLD_H2_PATH:./data/hold_year}
spring.datasource.url=jdbc:h2:file:${portable.h2.path};MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

server.port=${HOLD_PORT:8080}
# 发给别人的包里请换掉这个默认密钥（换了只会让已登录的会话失效，存档不受影响）
app.jwt.secret=${HOLD_JWT_SECRET:hold-year-portable-shared-secret}
app.jwt.ttl-hours=${HOLD_JWT_TTL_HOURS:720}

# 这是给玩家玩的，不是给运维看的
logging.level.root=INFO
