spring.application.name=Hold-Hundred-Year

# 数据库与密钥都支持"不改代码换值"：环境变量优先，冒号后面是本机开发的默认值。
# 给朋友玩时只要设 $env:HOLD_DB_PASSWORD / $env:HOLD_JWT_SECRET 再启动即可（见 README「给朋友玩」）。
spring.datasource.url=${HOLD_DB_URL:jdbc:mysql://localhost:3306/hold_year?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${HOLD_DB_USER:root}
spring.datasource.password=${HOLD_DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis-plus.configuration.map-underscore-to-camel-case=true
server.port=${HOLD_PORT:8080}
# 不写 server.address：Tomcat 默认监听 0.0.0.0，局域网里朋友的机器才能连进来
# 生产/隧道场景必须换掉默认密钥（换了就重新签所有 token，等于把已登录的人请下线）
app.jwt.secret=${HOLD_JWT_SECRET:hold-year-dev-secret-change-in-prod-0123456789}
app.jwt.ttl-hours=${HOLD_JWT_TTL_HOURS:24}
